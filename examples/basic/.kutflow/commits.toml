[[choice]]
kind = "commit"
transition = "review"
reason = "This proposal is clear, coherent, and independently reviewable."

[[choice]]
kind = "commit"
transition = "discard_commit"
reason = "This proposal duplicates another implementation proposal."

[[choice]]
kind = "commit"
transition = "discard_commit"
reason = "This proposal does not contribute to any accepted wish."

[[choice]]
kind = "commit"
transition = "discard_commit"
reason = "This proposal bundles unrelated changes or exceeds one reviewable unit."

[[choice]]
kind = "commit"
transition = "add_wish"
reason = "This proposal reveals an intended outcome missing from the current wishes."

[[choice]]
kind = "commit"
transition = "add_commit"
reason = "Further independent implementation steps remain after this proposal."

[[rule]]
order = 30
target = { query = "unreviewed_commits", view = "commits" }
context = [
  { query = "reviewed_wishes", view = "wishes" },
  { query = "commits", view = "commits" },
]
choices = { query = "commit_transition_data", view = "transition_reasons" }
mode = "per_entity"
prompt = "Which reason best fits this commit proposal?"
